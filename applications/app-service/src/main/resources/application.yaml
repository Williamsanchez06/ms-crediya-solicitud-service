server:
  port: 8091
spring:
  application:
    name: "ms-crediya-solicitud-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya_loan_application"
    schema: "loan_application"
    username: "postgres"
    password: 12345
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    loanApplications: "/api/v1/application"
